<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#222}canvas{display:block}</style></head>
<body>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
const TUN='https://northeast-math-simple-looked.trycloudflare.com';
const params=new URLSearchParams(location.search);
const model=params.get('m')||'vendor/green-alien-RIGGED.glb';
const blink=parseFloat(params.get('blink')||'0');
const jaw=parseFloat(params.get('jaw')||'0');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x202024);
const cam=new THREE.PerspectiveCamera(40,1,0.01,100);
const rend=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
rend.setSize(700,700);document.body.appendChild(rend.domElement);
const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(1,1,2);scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,1.2);fill.position.set(-1,0.5,1.5);scene.add(fill);
scene.add(new THREE.AmbientLight(0xffffff,0.6));
const loader=new GLTFLoader();loader.setMeshoptDecoder(MeshoptDecoder);
loader.load(TUN+'/'+model,(g)=>{
  const obj=g.scene;scene.add(obj);
  // apply blink/jaw
  obj.traverse(m=>{ if(m.isMesh && m.morphTargetDictionary){
    const d=m.morphTargetDictionary, inf=m.morphTargetInfluences;
    for(const nm in d){ const i=d[nm];
      if(nm.startsWith('eyeBlink')) inf[i]=blink;
      if(nm==='jawOpen') inf[i]=jaw;
    }
  }});
  // frame
  const box=new THREE.Box3().setFromObject(obj);const c=box.getCenter(new THREE.Vector3());
  const size=box.getSize(new THREE.Vector3());
  cam.position.set(c.x, c.y, c.z + size.length()*1.4);
  cam.lookAt(c);
  rend.render(scene,cam);
  window.__done=true;
},undefined,(e)=>{window.__error=String(e);});
</script></body></html>
